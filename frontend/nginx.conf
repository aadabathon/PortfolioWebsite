server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router handles routing client-side, so any path that isn't a
    # real static file (e.g. /blog, /quant) needs to fall back to
    # index.html instead of nginx 404ing it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
