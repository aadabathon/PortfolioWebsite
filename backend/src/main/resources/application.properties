spring.application.name=backend

# Database connection (see .env.example / docker-compose.yml for the env vars below)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio}
spring.datasource.username=${DB_USER:portfolio}
spring.datasource.password=${DB_PASSWORD:portfolio}

# Let Hibernate keep the schema in sync with entities during early development.
# This is a deliberate shortcut for the scaffolding stage; a real migration tool
# (e.g. Flyway) should replace it before the schema needs to be trusted in production.
spring.jpa.hibernate.ddl-auto=update

# Base URL of the Python ML service, used once the backend calls into it.
app.ml-service.base-url=${ML_SERVICE_URL:http://localhost:8000}

# Origins allowed to call this API from a browser (comma-separated).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator endpoints (e.g. /actuator/health) have their own CORS handling,
# separate from the WebMvcConfigurer mapping above, which only covers
# regular @RestController endpoints.
management.endpoints.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
management.endpoints.web.cors.allowed-methods=GET

# Actuator exposes only /actuator/health by default, which is all we need for now.
